    - adaptive-router-anthropic:
        - claude-sonnet-5
        - claude-opus-5
        - claude-haiku-4-5

    # ---- Embeddings ------------------------------------------
    # Le fallback d'un embedding doit rester un embedding.
    - qwen3-embedding-8b-local:
        - nomic-embed-text-local
        - all-minilm-local

    - nomic-embed-text-local:
        - all-minilm-local

# ============================================================
# 9. CONTEXT-WINDOW FALLBACKS
# ============================================================
# Seuls des fallbacks disposant d'une fenêtre suffisante sont utilisés.
# Pour Claude, on évite les bascules cross-provider à cause des états
# de thinking potentiellement présents dans l'historique.

context_window_fallbacks:

  - claude-fable-5:
      - claude-opus-5
      - claude-sonnet-5

  - claude-opus-5:
      - claude-sonnet-5
      - claude-fable-5

  - claude-sonnet-5:
      - claude-opus-5
      - claude-fable-5

  - deepseek-v4-flash-cloud:
      - kimi-k3-cloud
      - glm-5.2-cloud

  - kimi-k3-cloud:
      - deepseek-v4-flash-cloud
      - mistral-large-3-675b-cloud

  - qwen3-coder-480b-cloud:
      - kimi-k2.7-code-cloud
      - devstral-2-123b-cloud

  - glm-5.2-cloud:
      - glm-5.3-flash-cloud
      - deepseek-v4-flash-cloud

  - glm-5.3-flash-cloud:
      - glm-5.2-cloud
      - deepseek-v4-flash-cloud

  - gemma4-31b-local:
      - glm-4.7-flash-local

  - qwen3-coder-30b-local:
      - qwen2.5-coder-32b-local

  - qwen2.5-coder-32b-local:
      - qwen3-coder-30b-local

  - qwen2.5-32b-local:
      - gemma4-31b-local

  - llama3.3-70b-local:
      - qwen2.5-32b-local

  - glm-4.7-flash-local:
      - gemma4-31b-local

# ============================================================
# 10. GENERAL SETTINGS
# ============================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true
  health_check_interval: 30
  enable_health_check_routing: true
  health_check_ignore_transient_errors: true

# ============================================================
# 11. LITELLM SETTINGS
# ============================================================

litellm_settings:
  drop_params: true
  set_verbose: false

  cache: true
  cache_params:
    type: redis-semantic
    redis_url: "redis://redis:6379"
    ttl: 3600
    similarity_threshold: 0.95
    redis_semantic_cache_embedding_model: ollama/nomic-embed-text

  success_callback:
    - langfuse

  failure_callback:
    - langfuse

  request_timeout: 180

# ============================================================
# 12. OLLAMA — VARIABLES D'ENVIRONNEMENT
# ============================================================
# Définir côté service/processus Ollama, pas dans ce YAML LiteLLM.
#
# PowerShell :
#
#   $env:OLLAMA_MAX_LOADED_MODELS=3
#   $env:OLLAMA_NUM_PARALLEL=2
#   $env:OLLAMA_KEEP_ALIVE="15m"
#   $env:OLLAMA_FLASH_ATTENTION=1
#   $env:OLLAMA_HOST="127.0.0.1:11434"
#   $env:OLLAMA_MAX_QUEUE=512
#   $env:OLLAMA_KV_CACHE_TYPE="q8_0"
#
# Si Ollama est dans Docker, privilégier la section environment:
# du compose.yaml plutôt que ces variables PowerShell.
#
# Note :
#   OLLAMA_HOST=127.0.0.1:11434 est correct uniquement si Ollama est
#   accessible depuis le même hôte. Si LiteLLM est dans un autre
#   conteneur, conserver un réseau Docker commun et utiliser le nom
#   de service "ollama" dans api_base.
# ============================================================
