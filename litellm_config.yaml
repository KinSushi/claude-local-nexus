          - gemma4-31b-local
          - qwen3-coder-30b-local
          - qwen2.5-coder-32b-local
          - qwen2.5-32b-local
          - llama3.3-70b-local
          - gemma4-12b-local
          - llama3.2-3b-local
        weights:
          quality: 1.0
          cost: 0.0
    model_info:
      description: "Adaptive Router — pool local textuel"

