services:
  db:
    image: postgres:16
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Moteur d'inference embarque.
  #
  # Place sous profil parce qu'il est le seul service dont TOUT se
  # retelecharge : l'image, et les 541 Go de poids que model_list.txt
  # reconstitue. Rien n'y merite d'etre preserve, et le conteneur le
  # plafonne a la memoire de la VM WSL2 — la moitie de la machine.
  #
  # Tant que COMPOSE_PROFILES=embedded figure dans .env, il demarre comme
  # avant. Retirer cette ligne, apres avoir installe Ollama sur l'hote et
  # bascule les api_base, suffit a le sortir de la pile :
  #     python scripts/nexus_switch_engine.py --to host
  ollama:
    profiles: ["embedded"]
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Backend d'inference. CPU par defaut, parce que le conteneur n'a pas
      # acces au GPU sous Windows et que Vulkan y provoquait des erreurs.
      #
      # Ces deux valeurs sont parametrees, et non figees : ajouter une carte
      # graphique plus tard ne doit demander aucune reecriture. Pour un GPU
      # NVIDIA, surcharger avec docker-compose.gpu.yml.
      OLLAMA_LLM_LIBRARY: ${OLLAMA_LLM_LIBRARY:-cpu}
      OLLAMA_VULKAN: ${OLLAMA_VULKAN:-false}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}   # Clé pour les modèles cloud
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"          # Accès local uniquement
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  litellm:
    # Epingle par DIGEST (contrat 78). « main-latest » suit en continu la
    # branche principale de LiteLLM, sans garantie de compatibilite avec
    # cette configuration (routeur adaptatif, usage-based-routing-v2).
    #
    # QUAND : 2026-09-02. COMMENT : digest lu sur l image DEJA deployee,
    #   docker image inspect ghcr.io/berriai/litellm:main-latest \n    #     --format '{{index .RepoDigests 0}}'
    # POURQUOI cette epingle ne change RIEN aujourd hui : elle nomme
    #   exactement l image qui tourne deja. Elle n arrete que la derive
    #   silencieuse — un « up » de demain ne ramenera plus une build
    #   differente sans que personne l ait decide.
    # POUR AVANCER DELIBEREMENT (contrat 79) : refaire le pull, relire le
    #   digest par la meme commande, le reporter ici, puis revalider.
    image: ghcr.io/berriai/litellm@sha256:41d9be75c624d7cfcc9123b74db0f2fbf4a1a3a2a658cf1b27e21a144f8e59ab
    container_name: litellm-proxy
    restart: unless-stopped
    # Ollama n'est plus une dependance de demarrage : LiteLLM ne le
    # contacte qu'au moment d'une requete, et le moteur peut desormais
    # vivre hors de la pile. Exiger sa sante au demarrage empecherait la
    # passerelle de tourner avec un Ollama installe sur l'hote.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-litellm_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      # `:-` et non `:?` : la plateforme est locale d'abord, elle doit
      # demarrer sans cle Anthropic. L'operateur `:?` echouait sur une
      # variable vide, donc exactement dans le cas que .env.example
      # decrit comme normal — « laisser vide desactive le plan Anthropic ».
      # Le depot ne pouvait alors pas demarrer sans payer, ce qui
      # contredisait sa promesse centrale.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}       # Même variable que dans Ollama
      PYTHONUTF8: "1"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    ports:
      - "127.0.0.1:4000:4000"            # Accès local uniquement
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro   # Lecture seule
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # OU : le seul service de la pile qui n avait aucun etat de sante.
    # QUAND : mesure le 2026-09-02 sur le conteneur de production —
    #   docker inspect litellm-proxy --format '{{.State.Health}}'
    #   -> <nil> , alors que db, redis et ollama en portent un.
    # COMMENT : /health/liveliness ne demande aucune authentification et
    #   ne teste aucune dependance (endpoint documente par LiteLLM).
    #   L image runtime, base Chainguard Wolfi, n embarque NI curl NI
    #   wget — verifie dans l image meme — mais python est sur le PATH.
    #   D ou la sonde en python et non en curl : une sonde qui appelle un
    #   binaire absent rend « unhealthy » en permanence, ce qui est pire
    #   qu absent puisque cela se lit comme une panne du service.
    # POURQUOI on peut l affirmer : preuve d execution, meme jour —
    #   docker exec litellm-proxy python -c "...urlopen(...)"
    #   -> 200 b'"I'm alive!"'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  redis_data:
  ollama_data: